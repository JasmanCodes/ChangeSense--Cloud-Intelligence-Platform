services:
  postgres:
    image: postgres:16-alpine
    container_name: changesense-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: changesense
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d changesense"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: changesense-backend
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/changesense?schema=public
      CLIENT_URL: http://localhost:5173
      JWT_ACCESS_SECRET: changesense-jwt-access-secret-prod-2026
      JWT_REFRESH_SECRET: changesense-jwt-refresh-secret-prod-2026
      GEMINI_API_KEY: ${GEMINI_API_KEY:-mock-gemini-key}
      CHANGESENSE_AWS_ACCOUNT_ID: ${CHANGESENSE_AWS_ACCOUNT_ID:-123456789012}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: changesense-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
